<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF7F5;--cream2:#F3E9E4;--paper:#FFFDFB;--blush:#E9BDBE;--rose:#C97C86;
 --plum:#5E3A47;--ink:#3B2E33;--soft:#6E5C62;--faint:#9C8A90;--line:rgba(59,46,51,.11);
 --sh:0 20px 55px -26px rgba(59,46,51,.42);
 --serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:300;
 line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;display:block}
::selection{background:var(--blush)}
button{font-family:inherit;cursor:pointer}

.wash{position:fixed;inset:0;z-index:-2;pointer-events:none;background:
 radial-gradient(880px 620px at 10% 4%,rgba(233,189,190,.42),transparent 62%),
 radial-gradient(760px 700px at 92% 26%,rgba(201,162,39,.10),transparent 60%),
 radial-gradient(900px 800px at 60% 100%,rgba(201,124,134,.24),transparent 64%),var(--cream)}
.petals{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-10vh;color:var(--rose);opacity:.3;animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}12%{opacity:.38}
 88%{opacity:.28}100%{transform:translate3d(var(--dx,40px),112vh,0) rotate(430deg);opacity:0}}

#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;
 background:linear-gradient(90deg,var(--blush),var(--rose));transition:width .1s linear}

/* --- controls --- */
#ctrl{position:fixed;top:14px;right:14px;z-index:60;display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,253,251,.9);
 backdrop-filter:blur(10px);color:var(--rose);display:grid;place-items:center;font-size:14px;
 box-shadow:0 6px 18px -10px rgba(59,46,51,.4);transition:.25s}
.ib:hover{background:#fff;transform:scale(1.06)}
.ib.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.ib.off{color:var(--faint);position:relative}
.ib.off::after{content:"";position:absolute;left:9px;right:9px;top:50%;height:1.5px;
 background:currentColor;transform:rotate(-38deg);border-radius:2px}

/* --- hero --- */
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
#hero{min-height:100svh;display:flex;align-items:center;padding:80px 0 40px}
.hg{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(28px,6vw,68px);align-items:center;width:100%}
.eyebrow{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose);
 font-weight:500;margin-bottom:16px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(42px,9.5vw,92px);line-height:1.02;
 letter-spacing:-.01em;margin-bottom:22px}
h1 span{display:inline-block;opacity:0;transform:translateY(26px);
 animation:wIn .9s cubic-bezier(.19,1,.22,1) forwards}
@keyframes wIn{to{opacity:1;transform:none}}
.hsub{font-size:13.5px;color:var(--faint);max-width:40ch;margin-bottom:30px}
.frame{background:var(--paper);padding:11px 11px 44px;border-radius:5px;box-shadow:var(--sh);
 transform:rotate(-2deg);position:relative}
.frame::after{content:"11.06.2024 — 07.10.2025";position:absolute;bottom:15px;left:0;right:0;
 text-align:center;font-family:var(--serif);font-style:italic;color:var(--faint);font-size:13px}
.frame .in{border-radius:2px;overflow:hidden;aspect-ratio:4/5}
.frame .in img{width:100%;height:100%;object-fit:cover;object-position:center 30%;
 animation:kb 40s ease-in-out infinite alternate}

/* --- timeline --- */
#tlSec{padding:20px 0 40px}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;transform:translateX(-.5px);
 background:linear-gradient(180deg,transparent,var(--line) 5%,var(--line) 95%,transparent)}
.mo{position:relative;display:grid;grid-template-columns:1fr 62px 1fr;align-items:center;
 margin-bottom:clamp(52px,8vw,92px);opacity:0;transform:translateY(26px);
 transition:opacity .85s cubic-bezier(.22,.8,.3,1),transform .85s cubic-bezier(.22,.8,.3,1)}
.mo.in{opacity:1;transform:none}
.dot{grid-column:2;justify-self:center;width:11px;height:11px;border-radius:50%;background:var(--cream);
 border:1.5px solid var(--rose);z-index:2;transition:.6s}
.mo.in .dot{background:var(--rose);box-shadow:0 0 0 6px rgba(201,124,134,.15)}
.mm{grid-column:1;padding-right:clamp(14px,3vw,38px)}
.mo.flip .mm{grid-column:3;padding-right:0;padding-left:clamp(14px,3vw,38px)}
.chip{display:inline-block;font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;
 color:var(--rose);border:1px solid rgba(201,124,134,.34);border-radius:999px;padding:4px 12px;
 margin-bottom:12px;background:rgba(255,255,255,.6)}
.lab{font-family:var(--serif);font-size:clamp(19px,2.6vw,25px);color:var(--plum);
 line-height:1.25;margin:0 0 14px;max-width:26ch}
.pol{background:var(--paper);padding:9px 9px 34px;border-radius:5px;box-shadow:var(--sh);
 transform:rotate(-1.5deg);transition:transform .6s cubic-bezier(.22,.8,.3,1);position:relative}
.mo.flip .pol{transform:rotate(1.7deg)}
.pol:hover{transform:rotate(0) scale(1.02)}
.art{aspect-ratio:4/3;overflow:hidden;border-radius:2px;background:var(--cream2)}
.art.ph{aspect-ratio:3/4}
.art svg,.art img{width:100%;height:100%;object-fit:cover;display:block}
.art img{object-position:center 28%}
.mo.in .art.ph img{animation:kb 30s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.13) translate(-1.5%,-2%)}}
.cap{position:absolute;left:0;right:0;bottom:11px;text-align:center;font-family:var(--serif);
 font-style:italic;color:var(--faint);font-size:13px}
.ph-wrap{width:min(272px,100%);margin:20px 0 0;background:var(--paper);border-radius:25px;padding:8px;
 box-shadow:var(--sh);border:1px solid var(--line)}
.scr{background:#EDE3DF;border-radius:18px;overflow:hidden}
.hd{background:rgba(255,255,255,.78);padding:8px 12px;display:flex;align-items:center;gap:9px;
 border-bottom:1px solid rgba(0,0,0,.05)}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--blush),var(--rose));
 display:grid;place-items:center;color:#fff;font-size:11px;font-weight:500;flex:none}
.nm{font-size:12px;font-weight:500}.st{font-size:9px;color:var(--faint);margin-top:-3px}
.msgs{padding:12px 10px;display:flex;flex-direction:column;gap:6px;min-height:100px}
.b{max-width:82%;padding:7px 11px;border-radius:15px;font-size:12.5px;line-height:1.5;
 word-wrap:break-word;opacity:0;transform:translateY(8px)}
.mo.in .b{animation:bIn .5s cubic-bezier(.19,1,.22,1) forwards}
@keyframes bIn{to{opacity:1;transform:none}}
.b.me{align-self:flex-end;background:var(--rose);color:#fff;border-bottom-right-radius:4px}
.b.her{align-self:flex-start;background:#fff;border-bottom-left-radius:4px;
 box-shadow:0 1px 2px rgba(0,0,0,.05)}
.nore{align-self:flex-start;font-size:10.5px;color:var(--faint);font-style:italic;padding:6px 2px 0}

/* the one big moment */
.mo.big{grid-template-columns:1fr;margin:clamp(70px,11vw,130px) 0}
.mo.big .dot{grid-column:1;justify-self:center;width:15px;height:15px;margin-bottom:26px;border-width:2px}
.mo.big.in .dot{box-shadow:0 0 0 9px rgba(201,124,134,.16),0 0 0 20px rgba(201,124,134,.07)}
.mo.big .mm,.mo.big.flip .mm{grid-column:1;padding:0;max-width:520px;margin:0 auto;position:relative}
.mo.big .mm::before{content:"";position:absolute;inset:-14% -18%;z-index:-1;border-radius:50%;
 background:radial-gradient(closest-side,rgba(233,189,190,.55),rgba(233,189,190,0) 72%)}
.big-l{display:block;font-family:var(--serif);font-style:italic;font-size:clamp(21px,3.4vw,30px);
 color:var(--rose);text-align:center;margin-bottom:12px}
.mo.big .chip{display:block;width:max-content;margin:0 auto 18px;background:var(--rose);color:#fff;
 border-color:var(--rose)}
.mo.big .lab{font-size:clamp(23px,3.2vw,30px);text-align:center;margin:0 auto 18px;color:var(--rose);
 max-width:none}
.mo.big .ph-wrap{margin:24px auto 0;width:min(320px,100%)}
.mo.big .b{font-size:13.5px}

#end{text-align:center;padding:clamp(50px,9vw,110px) 0 clamp(70px,12vw,140px)}
.heart{margin:0 auto;width:26px;color:var(--rose);animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.17)}28%{transform:scale(1)}
 42%{transform:scale(1.12)}}
.sc{width:100%;height:100%;display:block}

@media(prefers-reduced-motion:reduce){
 .mo{opacity:1!important;transform:none!important;transition:none}
 .petal,.sc *{animation:none!important}
 .art img,.frame .in img{animation:none!important}
}
@media(max-width:860px){
 .hg{grid-template-columns:1fr;gap:32px}.frame{max-width:320px}
 .tl::before{left:12px}
 .mo{grid-template-columns:26px 1fr}
 .dot{grid-column:1;align-self:start;margin-top:8px}
 .mm,.mo.flip .mm{grid-column:2;padding:0 0 0 17px}
 .mo.big{grid-template-columns:1fr}
 .mo.big .mm,.mo.big.flip .mm{grid-column:1;padding:0}
 .mo.big .dot{grid-column:1;margin:0 auto 20px}
 .pol,.mo.flip .pol{transform:rotate(-1deg)}
 #ctrl{top:auto;bottom:14px;right:14px}
}
</style>
</head>

<script>
"use strict";
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---------- hero ---------- */
$("#h1").innerHTML = TITLE.split(" ").map(function(w,i){
  return '<span style="animation-delay:'+(0.15+i*0.12)+'s">'+esc(w)+'</span>'; }).join(" ");
$("#heroImg").src = HERO_PHOTO;

/* ---------- petals ---------- */
var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!reduced){
  var pc = $("#petals"), ch = ["❀","✿","❁","·","✦"];
  for(var i=0;i<14;i++){
    var d=document.createElement("div"); d.className="petal"; d.textContent=ch[i%ch.length];
    d.style.left=(Math.random()*100)+"%";
    d.style.animationDuration=(17+Math.random()*20)+"s";
    d.style.animationDelay=(-Math.random()*32)+"s";
    d.style.fontSize=(9+Math.random()*12)+"px";
    d.style.setProperty("--dx",(Math.random()*160-80)+"px");
    pc.appendChild(d);
  }
}

/* ---------- timeline ---------- */
var tl = $("#tl"), sent = $("#sent"), shown = 0, PAGE = 6;
var initial = (HER.charAt(0)||"A").toUpperCase();

var io = new IntersectionObserver(function(es){
  es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
},{threshold:.14, rootMargin:"0px 0px -6% 0px"});

function build(m, i){
  var hasPhoto = !!m.p;
  var art = hasPhoto
    ? '<img loading="lazy" decoding="async" src="'+esc(m.p)+'" alt="">'
    : (SCENES[m.s] || SCENES.hearts || "");

  var chat = "";
  if(m.c && m.c.length){
    var bubs = m.c.map(function(b,j){
      return '<div class="b '+(b[0]?"me":"her")+'" style="animation-delay:'+(0.3+j*0.38)+'s">'+esc(b[1])+'</div>';
    }).join("");
    var last = m.c[m.c.length-1];
    var nore = (!last[0] && i === MOMENTS.length-1) ? '<div class="nore">— koi jawab nahi —</div>' : "";
    chat = '<div class="ph-wrap"><div class="scr">'
         + '<div class="hd"><div class="av">'+esc(initial)+'</div><div>'
         + '<div class="nm">'+esc(HER)+'</div><div class="st">'+esc(m.d)+'</div></div></div>'
         + '<div class="msgs">'+bubs+nore+'</div></div></div>';
  }

  var el = document.createElement("div");
  el.className = "mo" + (i%2 ? " flip" : "") + (m.f ? " big" : "");
  el.innerHTML =
    '<div class="dot"></div><div class="mm">'
    + (m.f && m.fl ? '<span class="big-l">'+esc(m.fl)+'</span>' : "")
    + '<span class="chip">'+esc(m.d)+'</span>'
    + (m.l ? '<div class="lab">'+esc(m.l)+'</div>' : "")
    + '<div class="pol"><div class="art'+(hasPhoto?" ph":"")+'">'+art+'</div>'
    + '<div class="cap">'+esc(m.d)+'</div></div>'
    + chat + '</div>';
  return el;
}

function more(){
  if(shown >= MOMENTS.length) return false;
  var n = Math.min(PAGE, MOMENTS.length - shown);
  for(var k=0;k<n;k++){
    var el = build(MOMENTS[shown+k], shown+k);
    tl.appendChild(el);
    io.observe(el);
  }
  shown += n;
  return true;
}
more(); more();

new IntersectionObserver(function(es){
  if(es.some(function(e){ return e.isIntersecting; })) more();
},{rootMargin:"1600px 0px"}).observe(sent);

/* ---------- progress ---------- */
var bar = $("#bar");
function prog(){
  var h = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (h>0 ? Math.min(100,(scrollY/h)*100) : 0) + "%";
}
addEventListener("scroll", prog, {passive:true});
addEventListener("resize", prog);
prog();

/* ---------- music ----------
   Browsers will not play audio until someone interacts with the page,
   so it starts on her very first touch/scroll/keypress — no button to
   find. One tap on the note stops it, and then it stays stopped.      */
var au = document.getElementById("au"), mBtn = document.getElementById("mBtn");
var stoppedByHer = false;
au.volume = VOLUME;

function paintM(){
  var on = !au.paused;
  mBtn.classList.toggle("on", on);
  mBtn.classList.toggle("off", !on);
  mBtn.title = on ? "music band karo" : "music chalu karo";
}
function startM(){
  if(stoppedByHer || !au.paused) return;
  au.volume = VOLUME;
  var p = au.play();
  if(p && p.catch) p.catch(function(){});
}
mBtn.addEventListener("click", function(e){
  e.stopPropagation();
  if(au.paused){ stoppedByHer = false; startM(); }
  else { stoppedByHer = true; au.pause(); }
});
au.addEventListener("play", paintM);
au.addEventListener("pause", paintM);

/* the first genuine gesture of any kind gets it going */
["pointerdown","touchstart","touchend","click","keydown","wheel","scroll"].forEach(function(ev){
  addEventListener(ev, startM, {passive:true});
});
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") startM();
});
startM();          /* in case the browser is feeling generous */
paintM();

/* ---------- auto-scroll ---------- */
var auto = false, raf = null, last = 0, SPEED = 34;
var aBtn = $("#aBtn");
function tick(t){
  if(!auto){ raf = null; return; }
  if(!last) last = t;
  var dt = Math.min(t-last, 60); last = t;
  var h = document.documentElement.scrollHeight - innerHeight;
  if(scrollY < h-2) scrollBy(0, SPEED*dt/1000);
  raf = requestAnimationFrame(tick);
}
function setAuto(on){
  auto = on && !reduced;
  aBtn.classList.toggle("on", auto);
  aBtn.innerHTML = auto ? "&#10073;&#10073;" : "&#9654;";
  aBtn.title = auto ? "auto-scroll band karo" : "auto-scroll chalu karo";
  if(auto){ last = 0; if(!raf) raf = requestAnimationFrame(tick); }
  else if(raf){ cancelAnimationFrame(raf); raf = null; }
}
aBtn.addEventListener("click", function(e){ e.stopPropagation(); setAuto(!auto); });
["wheel","touchstart"].forEach(function(e){
  addEventListener(e, function(){ if(auto) setAuto(false); }, {passive:true});
});
setAuto(true);

$("#tBtn").addEventListener("click", function(e){
  e.stopPropagation(); setAuto(false); scrollTo({top:0,behavior:"smooth"});
});

</script>
